services:
  database:
    image: neo4j:5.26.0
    environment:
      NEO4J_AUTH: neo4j/${KNOWTRACE_DB_PASSWORD:?Database password is required}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    image: knowtrace/backend:1.0.0
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      NEO4J_URI: bolt://database:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${KNOWTRACE_DB_PASSWORD}
      NEO4J_DATABASE: neo4j
      LLM_MODEL_CONFIG_DEEPSEEK_DEMO: deepseek-chat,https://api.deepseek.com,${KNOWTRACE_API_KEY:?API key is required}
      TRACK_USER_USAGE: "false"
      IS_EMBEDDING: "true"
      EMBEDDING_PROVIDER: sentence-transformer
      EMBEDDING_MODEL: all-MiniLM-L6-v2
      ALLOWED_FRONTEND_ORIGINS: http://127.0.0.1:3015
    volumes:
      - upload_cache:/code/course_upload_cache
      - merged_files:/code/merged_files
      - chunk_cache:/code/chunks
    depends_on:
      database:
        condition: service_healthy
volumes:
  neo4j_data:
  upload_cache:
  merged_files:
  chunk_cache:
